<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started Now</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="mainBody">

<section class="left">
    <div class="tabs" id="mainTabs">
        <button class="tab-btn active" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
        <button class="tab-btn" id="tabSignin" onclick="switchTab('signin')">Sign In</button>
    </div>

    <div class="panel-signup active" id="panelSignup">
        <h1>Get Started Now</h1>
        <form id="signupForm" action="/signup" method="POST" onsubmit="return validateSignup()">
            <div class="field"><label>Name</label><input type="text" id="suName" name="name" placeholder="Enter your name"></div>
            <div class="field"><label>Email address</label><input type="email" id="suEmail" name="email" placeholder="Enter your email"></div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="suPassword" name="password" placeholder="Create a password" oninput="checkPwComplexity(this.value)">
                <div class="pw-rules" id="pwRules">
                    <div class="pw-rule" id="rule-upper"><span class="rule-icon">○</span> At least one uppercase letter (A–Z)</div>
                    <div class="pw-rule" id="rule-lower"><span class="rule-icon">○</span> At least one lowercase letter (a–z)</div>
                    <div class="pw-rule" id="rule-length"><span class="rule-icon">○</span> Minimum 8 characters</div>
                </div>
            </div>
            <button class="btn-primary" type="submit">Signup</button>
        </form>
        
        <div class="divider">or continue with</div>
        <div class="social-row">
            <form action="/googleSSO" method="POST" style="flex: 1;">
                <button class="btn-social" type="submit" style="width: 100%;">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Google
                </button>
            </form>
            <form action="/appleSSO" method="POST" style="flex: 1;">
                <button class="btn-social" type="submit" style="width: 100%;">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#000" d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.14-.49-3.17.02-1.04.51-2.03.62-2.96-.34-4.51-4.63-5.32-10.9-1.78-14.28 1.48-1.41 3.16-1.63 4.41-1.64 1.47.01 2.76.88 3.51.88.73 0 2.27-1.04 4.04-.88 1.35.05 2.59.54 3.5 1.4-2.89 1.63-2.39 5.86.6 7.15-.65 1.76-1.55 3.73-3.04 5.25l-.03.04H17.05zM12.03 4.24c-.16-1.72 1.34-3.23 3.04-3.24.23 1.76-1.45 3.38-3.04 3.24z"/></svg>
                    Apple
                </button>
            </form>
        </div>

        <p class="switch-row">Have an account? <a onclick="switchTab('signin')">Sign In</a></p>
    </div>

    <div class="panel-signin" id="panelSignin">
        <h1>Welcome Back</h1>
        <form id="signinForm" action="/login" method="POST" onsubmit="return validateLogin()">
            <div class="field"><label>Email address</label><input type="email" id="siEmail" name="email" placeholder="Enter your email"></div>
            <div class="field">
                <label>Password</label><input type="password" id="siPassword" name="password" placeholder="Enter your password">
                <div class="attempt-row">
                    <div class="dot" id="dot1"></div><div class="dot" id="dot2"></div><div class="dot" id="dot3"></div>
                    <span class="error-msg" id="errMsg">Wrong password</span>
                </div>
            </div>
            <button class="btn-primary" id="loginBtn" type="submit">Sign In</button>
        </form>

        <div class="divider">or continue with</div>
        <div class="social-row">
            <form action="/googleSSO" method="POST" style="flex: 1;">
                <button class="btn-social" type="submit" style="width: 100%;">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Google
                </button>
            </form>
            <form action="/appleSSO" method="POST" style="flex: 1;">
                <button class="btn-social" type="submit" style="width: 100%;">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#000" d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.14-.49-3.17.02-1.04.51-2.03.62-2.96-.34-4.51-4.63-5.32-10.9-1.78-14.28 1.48-1.41 3.16-1.63 4.41-1.64 1.47.01 2.76.88 3.51.88.73 0 2.27-1.04 4.04-.88 1.35.05 2.59.54 3.5 1.4-2.89 1.63-2.39 5.86.6 7.15-.65 1.76-1.55 3.73-3.04 5.25l-.03.04H17.05zM12.03 4.24c-.16-1.72 1.34-3.23 3.04-3.24.23 1.76-1.45 3.38-3.04 3.24z"/></svg>
                    Apple
                </button>
            </form>
        </div>

        <p class="switch-row">Don't have an account? <a onclick="switchTab('signup')">Sign Up</a></p>
    </div>

</section>

<section class="right" id="rightPanel">
    <div class="right-bg"></div>
    <div class="leaf leaf-1"></div>
    <div class="leaf leaf-2"></div>
    <div class="leaf leaf-3"></div>
    <div class="eye-scene">
        <div class="eye-label" id="eyeLabel">watching you</div>
        <div class="eyes-row">
            <div class="eye-wrapper">
                <div class="brow"><svg viewBox="0 0 180 22"><path class="brow-path" id="browL" d="M 20,16 Q 90,16 160,16"/></svg></div>
                <div class="eye-outer"><div class="eye-white"><div class="iris-wrap" id="irisL"><div class="iris"><div class="pupil"></div></div></div></div></div>
            </div>
            <div class="eye-wrapper">
                <div class="brow"><svg viewBox="0 0 180 22"><path class="brow-path" id="browR" d="M 20,16 Q 90,16 160,16"/></svg></div>
                <div class="eye-outer"><div class="eye-white"><div class="iris-wrap" id="irisR"><div class="iris"><div class="pupil"></div></div></div></div></div>
            </div>
        </div>
        <div class="warning-text" id="warnText">⚠ &nbsp; INTRUSION DETECTED — ACCESS DENIED</div>
    </div>
</section>

<div id="cursor"></div>
<script src="script.js"></script>
</body>
</html>
